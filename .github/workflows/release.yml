name: 5 - Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release-qa:
    name: 5 - Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read

    outputs:
      version: ${{ steps.validate.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 1

      - name: Set up PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.0'
          coverage: none

      - name: Validate release inputs
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          TAG_VERSION="$VERSION"
          PLUGIN_VERSION="$(grep -E '^[[:space:]]*\*?[[:space:]]*Version:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+' webmastery-site-toolkit-for-mcp.php | head -1 | sed -E 's/.*Version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/')"
          TEXT_DOMAIN="$(grep -E '^[[:space:]]*\*?[[:space:]]*Text Domain:' webmastery-site-toolkit-for-mcp.php | head -1 | sed -E 's/.*Text Domain:[[:space:]]*//' | tr -d '\r')"
          STABLE_TAG="$(grep -Ei '^Stable tag:' readme.txt | head -1 | sed -E 's/^Stable tag:[[:space:]]*//I' | tr -d '\r')"
          SHORT_DESCRIPTION="$(awk 'BEGIN{after_header=0} /^Donate link:/ {after_header=1; next} after_header && NF {print; exit}' readme.txt | tr -d '\r')"

          if [ -z "$PLUGIN_VERSION" ]; then
            echo "Could not parse plugin version from webmastery-site-toolkit-for-mcp.php" >&2
            exit 1
          fi
          if [ "$TEXT_DOMAIN" != "webmastery-site-toolkit-for-mcp" ]; then
            echo "Text Domain ($TEXT_DOMAIN) does not match canonical slug webmastery-site-toolkit-for-mcp" >&2
            exit 1
          fi
          if [ -z "$STABLE_TAG" ]; then
            echo "Could not parse Stable tag from readme.txt" >&2
            exit 1
          fi
          if [ ${#SHORT_DESCRIPTION} -gt 150 ]; then
            echo "readme.txt short description is ${#SHORT_DESCRIPTION} characters; WordPress.org supports a maximum of 150" >&2
            exit 1
          fi
          if [ "$TAG_VERSION" != "$PLUGIN_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match plugin header version ($PLUGIN_VERSION)" >&2
            exit 1
          fi
          if [ "$TAG_VERSION" != "$STABLE_TAG" ]; then
            echo "Tag version ($TAG_VERSION) does not match readme stable tag ($STABLE_TAG)" >&2
            exit 1
          fi

          RELEASE_TAG="v$TAG_VERSION"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing duplicate publish" >&2
            exit 1
          fi

          NOTES_FILE="build/release-notes-${TAG_VERSION}.md"
          mkdir -p build
          NOTES="$(awk "/^= ${TAG_VERSION} =/{found=1; next} found && /^= /{exit} found{print}" readme.txt | sed '/^[[:space:]]*$/d')"
          if [ -z "$NOTES" ]; then
            echo "No plugin release notes found in readme.txt for version ${TAG_VERSION}" >&2
            exit 1
          fi
          printf '%s\n' "$NOTES" > "$NOTES_FILE"

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "notes-file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Run 5 - Release Package QA
        run: bash scripts/release-qa.sh "${{ steps.validate.outputs.version }}"

  publish:
    name: 5 - Publish Release
    needs: release-qa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    environment:
      name: wordpress-org
      url: https://wordpress.org/plugins/webmastery-site-toolkit-for-mcp/

    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          fetch-depth: 1

      - name: Set up PHP
        uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.0'
          coverage: none

      - name: Prepare release artifacts
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.release-qa.outputs.version }}"
          ZIP_FILE="$(bash scripts/build-release.sh "$VERSION")"
          NOTES_FILE="build/release-notes-${VERSION}.md"
          NOTES="$(awk "/^= ${VERSION} =/{found=1; next} found && /^= /{exit} found{print}" readme.txt | sed '/^[[:space:]]*$/d')"

          if [ -z "$NOTES" ]; then
            echo "No plugin release notes found in readme.txt for version ${VERSION}" >&2
            exit 1
          fi

          printf '%s\n' "$NOTES" > "$NOTES_FILE"
          echo "zip-file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "notes-file=$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Verify GitHub Release is unpublished
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="v${{ needs.release-qa.outputs.version }}"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing duplicate publish" >&2
            exit 1
          fi

      - name: Deploy to WordPress.org SVN
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: webmastery-site-toolkit-for-mcp
          VERSION: ${{ needs.release-qa.outputs.version }}
          BUILD_DIR: build/webmastery-site-toolkit-for-mcp

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.release-qa.outputs.version }}"
          gh release create "v${VERSION}" \
            "${{ steps.artifacts.outputs.zip-file }}" \
            --title "v${VERSION}" \
            --notes-file "${{ steps.artifacts.outputs.notes-file }}"
